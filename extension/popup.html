<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolsVerse Utilities</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 380px;
      max-height: 540px;
      overflow-y: auto;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 14px;
    }
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    .brand-text h1 {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .brand-text p {
      font-size: 10px;
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .open-full {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: none;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .open-full:hover {
      background: #334155;
      color: #ffffff;
    }
    /* Search */
    .search-box {
      margin: 12px 0 10px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 9px 12px 9px 34px;
      color: white;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #6366f1;
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.6;
    }
    /* Filter Pills */
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .filter-pills::-webkit-scrollbar {
      display: none;
    }
    .pill {
      background: #1e293b;
      color: #94a3b8;
      border: none;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .pill.active, .pill:hover {
      background: #4f46e5;
      color: white;
    }
    /* Section Title */
    .section-title {
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 10px 0 6px;
    }
    /* Tool Grid */
    .tools-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tool-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .tool-item:hover {
      background: #273549;
      border-color: #6366f1;
      transform: translateX(2px);
    }
    .tool-icon {
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tool-info {
      flex: 1;
      min-width: 0;
    }
    .tool-name {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tool-desc {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .tool-arrow {
      color: #64748b;
      font-size: 12px;
    }
    /* Footer */
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #64748b;
    }
    .footer a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }
    .empty-state {
      display: none;
      text-align: center;
      padding: 24px 10px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="logo">TV</div>
      <div class="brand-text">
        <h1>ToolsVerse</h1>
        <p>🔒 100% In-Browser &bull; Zero Uploads</p>
      </div>
    </div>
    <a href="https://toolsverseapp.com" target="_blank" class="open-full">Web Suite ↗</a>
  </div>

  <!-- Search -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Search 103+ PDF & developer tools..." autofocus>
  </div>

  <!-- Filter Pills -->
  <div class="filter-pills" id="filterPills">
    <button class="pill active" data-filter="all">All</button>
    <button class="pill" data-filter="pdf">PDF Tools</button>
    <button class="pill" data-filter="dev">Developer</button>
    <button class="pill" data-filter="calc">Calculators</button>
    <button class="pill" data-filter="media">Media & Image</button>
    <button class="pill" data-filter="office">Office</button>
  </div>

  <div class="section-title" id="sectionTitle">Popular Utilities</div>

  <!-- Tools List -->
  <div class="tools-grid" id="toolsList">
    <!-- Populated by popup.js -->
  </div>

  <div class="empty-state" id="emptyState">
    No matching tools found. Try searching for "pdf", "json", "compress", or "calc".
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>Unlimited &bull; No limits &bull; Free forever</span>
    <a href="https://toolsverseapp.com" target="_blank">toolsverseapp.com ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
